<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#91d7ef"><title>마이홈 월드 V2</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,sans-serif;background:#8dd4ed;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}button{border:0;border-radius:13px;background:#fff;padding:11px;font-weight:750;box-shadow:0 2px 8px #0002;color:#24364b}button.active{background:#ffdb79}#tip{position:fixed;top:65px;left:10px;background:#ffffffcc;border-radius:9px;padding:7px;font-size:12px;z-index:2;pointer-events:none}#joy{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:22px;width:125px;height:125px;border-radius:50%;background:#ffffff70;border:3px solid #fff9;z-index:3;touch-action:none}#nub{position:absolute;width:53px;height:53px;left:33px;top:33px;border-radius:50%;background:#fff;box-shadow:0 3px 10px #0004}#rotate{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));right:15px;z-index:3;display:flex;gap:6px}#notice{position:fixed;left:50%;transform:translateX(-50%);bottom:180px;background:#17283dcc;color:white;padding:9px 15px;border-radius:15px;display:none;z-index:5;white-space:nowrap}canvas{display:block}</style></head><body><div id="hud"><button id="mode">🏠 집 꾸미기</button><button id="item">🛋️ 소파</button><button id="place">➕ 배치</button><button id="build">🧱 벽 만들기</button><button id="edit">✋ 가구 이동</button><button id="delete">🗑 삭제</button><button id="coins">🪙 500</button><button id="save">💾 저장</button><button id="reset">↺ 초기화</button></div><div id="tip">왼쪽 조이스틱: 이동 · 오른쪽 드래그: 시점 · 집 안에서 가구·벽 배치 · 가구 근처에서 이동/삭제</div><div id="joy"><div id="nub"></div></div><div id="rotate"><button id="left">↶</button><button id="right">↷</button></div><div id="notice"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#92d6ef');scene.fog=new THREE.Fog('#92d6ef',35,95);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x77a567,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(15,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const grass=mat('#78bd6d'),road=mat('#b6a99b'),wall=mat('#fff1d8'),roof=mat('#e88e82'),wood=mat('#b9835b');
function cube(w,h,d,m,x,y,z,shadow=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
cube(100,.2,100,grass,0,-.15,0,false);cube(7,.04,90,road,0,0,-5,false);cube(70,.04,5,road,0,.02,-17,false);
function house(x,z,color){let m=mat(color);cube(7,3.5,7,m,x,1.75,z);const r=new THREE.Mesh(new THREE.ConeGeometry(5.3,2.5,4),roof);r.position.set(x,4.7,z);r.rotation.y=Math.PI/4;scene.add(r);cube(1.5,2.5,.08,wood,x,1.25,z+3.54);for(let dx of [-2.3,2.3])cube(1.1,1.2,.1,mat('#a2dcf4'),x+dx,2.2,z+3.56)}
house(-12,-7,'#ffe2b5');house(12,-8,'#d3e8ff');house(-13,-26,'#ffd6e1');house(12,-27,'#d5f3cb');
// Open-front player house, with three walls so furniture remains visible.
cube(11,.15,10,mat('#e9c9a4'),0,.03,12);cube(11,3,.3,wall,0,1.5,7);cube(.3,3,10,wall,-5.5,1.5,12);cube(.3,3,10,wall,5.5,1.5,12);cube(2.5,1.4,.15,mat('#9bd7f5'),0,2,7.19);
for(let i=0;i<24;i++){let x=(i%2?-1:1)*(20+(i%4)*3),z=-36+Math.floor(i/2)*6;cube(.45,2,.45,wood,x,1,z);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,6),mat('#3c9860'));crown.position.set(x,3,z);scene.add(crown)}
const avatar=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.15,4,10),mat('#537be8'));body.position.y=1.05;avatar.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.39,14,10),mat('#ffd6ad'));head.position.y=2.08;avatar.add(head);scene.add(avatar);avatar.position.set(0,0,3);
const types=[['🛋️ 소파','#ffae8e',2,1,1],['🛏️ 침대','#b6a7f4',2.2,.55,2.4],['🪑 테이블','#b68b61',1.5,.8,1.3],['📺 TV','#333b50',1.5,1.1,.25],['🪴 화분','#4baf78',.8,1,.8]];let type=0,decorate=false,angle=0,items=[],walls=[],coins=500,editing=false,selected=null;let noticeTimer;
function toast(s){const n=document.querySelector('#notice');n.textContent=s;n.style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.style.display='none',2200)}
function furniture(t,x,z,rot=0){let d=types[t],o=cube(d[2],d[3],d[4],mat(d[1]),x,d[3]/2+.12,z);o.rotation.y=rot;items.push({t,x,z,rot,mesh:o});return o}
function updateCoins(){document.querySelector('#coins').textContent='🪙 '+coins}
function store(silent=false){localStorage.setItem('myhome-world-v2',JSON.stringify({items:items.map(({t,x,z,rot})=>({t,x,z,rot})),walls:walls.map(({x,z,mesh})=>({x,z})),coins}));if(!silent)toast('집이 저장됐어요!')}
function addWall(x,z){let mesh=cube(1,2.7,.18,wall,x,1.35,z);walls.push({x,z,mesh})}
function load(){try{let saved=JSON.parse(localStorage.getItem('myhome-world-v2')||'null');if(saved){(saved.items||[]).forEach(a=>furniture(a.t,a.x,a.z,a.rot));(saved.walls||[]).forEach(a=>addWall(a.x,a.z));coins=Number.isFinite(saved.coins)?saved.coins:500}else{JSON.parse(localStorage.getItem('myhome-world-v1')||'[]').forEach(a=>furniture(a.t,a.x,a.z,a.rot))}}catch{}updateCoins()}load();
function targetPosition(){return {x:Math.round(avatar.position.x),z:Math.round(avatar.position.z+2)}}
function inHouse(x,z){return Math.abs(x)<=4.5&&z>=8&&z<=16}
function nearest(){let best=null,dist=2.3;for(const a of [...items,...walls]){let d=Math.hypot(a.x-avatar.position.x,a.z-avatar.position.z);if(d<dist){dist=d;best=a}}return best}
function removeSelected(){let a=nearest();if(!a){toast('가구나 벽 가까이 이동하세요');return}if(items.includes(a)){items.splice(items.indexOf(a),1);coins+=10}else{walls.splice(walls.indexOf(a),1);coins+=5}scene.remove(a.mesh);updateCoins();store(true);toast('삭제했어요')}
document.querySelector('#coins').onclick=()=>toast('가구 30코인 · 벽 20코인 · 삭제 시 일부 환급');
document.querySelector('#build').onclick=()=>{if(!decorate){toast('먼저 집 꾸미기를 켜세요');return}let {x,z}=targetPosition();if(!inHouse(x,z)){toast('집 안에서 벽을 만들 수 있어요');return}if(coins<20){toast('코인이 부족해요');return}addWall(x,z);coins-=20;updateCoins();store(true);toast('벽 설치 완료!')};
document.querySelector('#delete').onclick=removeSelected;
document.querySelector('#edit').onclick=()=>{if(!decorate){toast('먼저 꾸미기 모드를 켜세요');return}let a=nearest();if(!a||!items.includes(a)){toast('이동할 가구 가까이 가세요');return}selected=a;editing=true;document.querySelector('#edit').classList.add('active');toast('이동할 곳으로 걸어간 뒤 이동 버튼을 다시 누르세요')};
document.querySelector('#mode').onclick=()=>{decorate=!decorate;document.querySelector('#mode').classList.toggle('active',decorate);toast(decorate?'꾸미기 모드: 집 안에서 배치!':'산책 모드')};document.querySelector('#item').onclick=()=>{type=(type+1)%types.length;document.querySelector('#item').textContent=types[type][0]+' '+['소파','침대','테이블','TV','화분'][type]};document.querySelector('#place').onclick=()=>{if(!decorate){toast('먼저 집 꾸미기 버튼을 누르세요');return}let x=Math.round(avatar.position.x),z=Math.round(avatar.position.z+2);if(Math.abs(x)>4.5||z<8||z>16){toast('집 안에서만 가구를 놓을 수 있어요');return}if(coins<30){toast('코인이 부족해요');return}furniture(type,x,z,angle);coins-=30;updateCoins();store(true);toast('가구를 배치했어요!')};document.querySelector('#save').onclick=()=>store();document.querySelector('#reset').onclick=()=>{if(!confirm('가구와 벽을 모두 지울까요?'))return;items.forEach(i=>scene.remove(i.mesh));walls.forEach(i=>scene.remove(i.mesh));items=[];walls=[];coins=500;updateCoins();store()};document.querySelector('#left').onclick=()=>{angle-=Math.PI/2;toast('가구 방향: 왼쪽')};document.querySelector('#right').onclick=()=>{angle+=Math.PI/2;toast('가구 방향: 오른쪽')};
let move={x:0,y:0},yaw=0,drag=false,px=0;const joy=document.querySelector('#joy'),nub=document.querySelector('#nub');function joystick(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,l/43);move={x:dx/l*k,y:dy/l*k};nub.style.transform=`translate(${move.x*40}px,${move.y*40}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joystick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joystick(e)});function stop(){move={x:0,y:0};nub.style.transform=''}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-px)*.008;px=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>drag=false);const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const clock=new THREE.Clock();camera.position.set(0,7,12);function tick(){requestAnimationFrame(tick);let dt=Math.min(clock.getDelta(),.05),mx=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=move.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let v=new THREE.Vector3(mx,0,my);if(v.length()>1)v.normalize();let dx=(v.x*Math.cos(yaw)+v.z*Math.sin(yaw))*dt*5,dz=(-v.x*Math.sin(yaw)+v.z*Math.cos(yaw))*dt*5;avatar.position.x=THREE.MathUtils.clamp(avatar.position.x+dx,-45,45);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z+dz,-45,45);if(v.length()>.05)avatar.rotation.y=Math.atan2(dx,dz);let target=new THREE.Vector3(avatar.position.x+Math.sin(yaw)*9,7,avatar.position.z+Math.cos(yaw)*9);camera.position.lerp(target,.08);camera.lookAt(avatar.position.x,1.4,avatar.position.z);if(editing&&selected){let b=document.querySelector('#edit');b.onclick=()=>{let {x,z}=targetPosition();if(!inHouse(x,z)){toast('집 안으로 이동하세요');return}selected.x=x;selected.z=z;selected.mesh.position.x=x;selected.mesh.position.z=z;editing=false;selected=null;b.classList.remove('active');b.onclick=()=>{if(!decorate){toast('꾸미기 모드를 켜세요');return}let a=nearest();if(!a||!items.includes(a)){toast('가구 가까이 가세요');return}selected=a;editing=true;b.classList.add('active');toast('이동할 곳으로 간 뒤 다시 누르세요')};store(true);toast('가구를 이동했어요')}}renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
